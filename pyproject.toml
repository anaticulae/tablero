[build-system]
requires = [
    "setuptools>=84.0.0",
    "wheel>=0.48.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "tablero"
version = "1.0.1"
description = ""
requires-python = ">=3.12"
authors = [
    { name = "Helmut Konrad Schewe", email = "helmutus@outlook.com" },
]
dependencies = [
    "camelot-py>=2.0.0,<3.0.0",
    "opencv-python>=5.0.0.93,<6.0.0",
    "rawmaker>=2.40.5,<3.0.0",
    "ughost>=1.1.1,<2.0.0",
    "utilo>=2.110.2,<3.0.0",
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.readme]
file = "README"
content-type = "text/markdown"

[project.optional-dependencies]
dev = [
    "gennex==1.1.0",
    "groupmes>=1.1.0,<2.0.0",
    "hoverpower==1.7.0",
    "ibidem==1.0.2",
    "pagenumber>=1.0.0,<2.0.0",
    "pycryptodome>=3.23.0,<4.0.0",
    "utilotest==1.1.1",
]

[project.urls]
Homepage = "https://github.com/anaticulae/tablero"
Repository = "https://github.com/anaticulae/tablero"

[project.scripts]
tablero = "tablero.cli:main"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]

[tool.semantic_release.changelog]
mode = "init"
output_format = "md"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG"

[tool.semantic_release.commit_parser_options]
patch_tags = [
    "build",
    "chore",
    "ci",
    "deps",
    "docs",
    "fix",
    "perf",
    "refactor",
    "style",
    "test",
]
minor_tags = [
    "feat",
]

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "tablero",
    "tablero.camelox",
    "tablero.features",
]
exclude = [
    "tests*",
]

[tool.hoverpower]
packages = [
    "BACHELOR",
    "BOOK",
    "DISS",
    "DOCU",
    "HOME",
    "MASTER",
    "ORDER",
]
